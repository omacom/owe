name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel meson ninja gcc pkgconf \
            wayland wayland-protocols libglvnd libepoxy mpv ffmpeg \
            systemd-libs socat python git
      - uses: actions/checkout@v5
      - name: Build
        run: |
          meson setup build --buildtype=release
          ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs
