name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel meson ninja gcc pkgconf \
            wayland wayland-protocols libglvnd libepoxy mpv ffmpeg \
            systemd-libs socat python git cmake qt6-declarative
      - uses: actions/checkout@v5
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          project="$(sed -n "s/^  version : '\([^']*\)'.*/\1/p" meson.build)"
          if [ "$version" != "$project" ]; then
            echo "tag version $version does not match meson.build $project" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          meson setup build --buildtype=release
          ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Build and test the lock feed plugin
        run: |
          cmake -S qml-plugin -B build-qml -DBUILD_TESTING=ON
          cmake --build build-qml
          ctest --test-dir build-qml --output-on-failure
      - name: Create the source archive
        run: meson dist -C build --formats xztar
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/meson-dist/*.tar.xz dist/
          sha256sum dist/*.tar.xz > dist/SHA256SUMS
          echo "version=${{ steps.version.outputs.version }}" > dist/release.env
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          . dist/release.env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$version"
            target="--target ${{ github.sha }}"
          else
            tag="$GITHUB_REF_NAME"
            target=""
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.xz dist/SHA256SUMS --clobber
            gh release edit "$tag" --draft=false
          else
            gh release create "$tag" $target --title "$tag" --generate-notes --draft=false \
              dist/*.tar.xz dist/SHA256SUMS
          fi
